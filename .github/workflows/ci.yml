name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    name: Swift host interoperability
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: swift test
  typescript:
    name: TypeScript and Cloudflare runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=low
      - run: npx --no-install wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm pack --workspace @oathconnect/protocol --workspace @oathconnect/sdk --workspace @oathconnect/thorchain --pack-destination dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oathconnect-preview-packages
          path: dist/*.tgz
          retention-days: 14
