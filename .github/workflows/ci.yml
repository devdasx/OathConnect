name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  labs:
    name: Testnet lab dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix labs/xrpl && npm audit --audit-level=low --prefix labs/xrpl
      - run: npm ci --ignore-scripts --prefix labs/stellar && npm audit --audit-level=low --prefix labs/stellar
      - run: npm ci --ignore-scripts --prefix labs/sui && npm audit --audit-level=low --prefix labs/sui
      - run: node --check labs/xrpl/run.mjs && node --check labs/stellar/run.mjs && node --check labs/solana/run.mjs && node --check labs/sui/run.mjs
      - run: node --test labs/support/evidence.test.mjs
      - run: node --check labs/browser-native/controller.mjs && node --test labs/browser-native/files.test.mjs
  security:
    name: Security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          output: analysis-results
      - run: node scripts/check-sarif.mjs analysis-results
  swift:
    name: Swift host interoperability
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: swift test
      - run: swift build --package-path labs/browser-native/native
  typescript:
    name: TypeScript and Cloudflare runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=low
      - run: npx --no-install wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm pack --workspace @oathconnect/protocol --workspace @oathconnect/sdk --workspace @oathconnect/thorchain --pack-destination dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oathconnect-preview-packages
          path: dist/*.tgz
          retention-days: 14
